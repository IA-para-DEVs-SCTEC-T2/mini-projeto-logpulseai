name: Sync Tasks to Kanban

on:
  push:
    branches:
      - main
    paths:
      - '.kiro/specs/*/tasks.md'
  workflow_dispatch:

jobs:
  sync-tasks:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      
      - name: Create issues from tasks.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_URL: https://github.com/orgs/IA-para-DEVs-SCTEC-T2/projects/7
        run: |
          echo "Criando issues a partir do tasks.md..."
          
          TASKS_FILE=".kiro/specs/logpulse-ia/tasks.md"
          
          if [ ! -f "$TASKS_FILE" ]; then
            echo "Arquivo tasks.md nao encontrado"
            exit 1
          fi
          
          create_issue() {
            local task_num=$1
            local task_title=$2
            local task_description=$3
            local task_acceptance=$4
            local task_dependencies=$5
            local task_estimate=$6
            local task_requirements=$7
            
            local title="[$task_num] $task_title"
            
            # Determina se pode ser feita em paralelo
            local parallelism="✅ Pode ser feita em paralelo"
            if [ -n "$task_dependencies" ] && [ "$task_dependencies" != "Nenhuma" ]; then
              parallelism="⚠️ Depende de: $task_dependencies"
            fi
            
            # Monta o corpo da issue com detalhes estruturados
            local body="## 📋 Tarefa $task_num: $task_title
          
          **Spec:** logpulse-ia
          
          ---
          
          ## 📝 Descrição
          
          $task_description
          
          ---
          
          ## ✅ Critérios de Aceitação
          
          $task_acceptance
          
          ---
          
          ## 🔄 Paralelismo e Dependências
          
          $parallelism
          
          ---
          
          ## ⏱️ Estimativa
          
          $task_estimate
          
          ---
          
          ## 📚 Requisitos
          
          $task_requirements
          
          ---
          
          ## 🔗 Links Úteis
          
          - [Ver tasks.md completo](.kiro/specs/logpulse-ia/tasks.md)
          - [Ver requirements.md](.kiro/specs/logpulse-ia/requirements.md)
          - [Ver design.md](.kiro/specs/logpulse-ia/design.md)
          
          ---
          
          **Criado automaticamente pelo workflow sync-tasks-to-kanban**"
            
            echo "Criando issue: $title"
            
            gh issue create --title "$title" --body "$body" --repo ${{ github.repository }} || echo "Erro ao criar issue"
            
            sleep 0.5
          }
          
          # Extrai tarefas principais e seus detalhes estruturados
          awk '
          BEGIN { 
            in_task = 0
            task_num = ""
            task_title = ""
            description = ""
            acceptance = ""
            dependencies = ""
            estimate = ""
            requirements = ""
            in_acceptance = 0
          }
          
          # Detecta tarefa principal (não subtarefa)
          /^- \[ \](\*)? [0-9]+\. / {
            # Se já estava processando uma tarefa, imprime antes de começar nova
            if (in_task == 1 && task_num != "") {
              print task_num "|||" task_title "|||" description "|||" acceptance "|||" dependencies "|||" estimate "|||" requirements
            }
            
            # Extrai número e título da nova tarefa
            match($0, /^- \[ \](\*)? ([0-9]+)\. (.*)/, arr)
            task_num = arr[2]
            task_title = arr[3]
            description = ""
            acceptance = ""
            dependencies = ""
            estimate = ""
            requirements = ""
            in_task = 1
            in_acceptance = 0
            next
          }
          
          # Detecta subtarefa (ignora - não queremos criar issues para subtarefas)
          /^  - \[ \](\*)? [0-9]+\.[0-9]+/ {
            next
          }
          
          # Detecta descrição
          /^  - \*\*Descrição:\*\*/ {
            if (in_task == 1) {
              sub(/^  - \*\*Descrição:\*\* /, "", $0)
              description = $0
              in_acceptance = 0
            }
            next
          }
          
          # Detecta início dos critérios de aceitação
          /^  - \*\*Critérios de Aceitação:\*\*/ {
            if (in_task == 1) {
              in_acceptance = 1
            }
            next
          }
          
          # Captura critérios de aceitação (linhas com ✅)
          /^    - ✅/ {
            if (in_task == 1 && in_acceptance == 1) {
              sub(/^    - ✅ /, "- ", $0)
              if (acceptance == "") {
                acceptance = $0
              } else {
                acceptance = acceptance "\n" $0
              }
            }
            next
          }
          
          # Detecta dependências
          /^  - \*\*Dependências:\*\*/ {
            if (in_task == 1) {
              sub(/^  - \*\*Dependências:\*\* /, "", $0)
              dependencies = $0
              in_acceptance = 0
            }
            next
          }
          
          # Detecta estimativa
          /^  - \*\*Estimativa:\*\*/ {
            if (in_task == 1) {
              sub(/^  - \*\*Estimativa:\*\* /, "", $0)
              estimate = $0
              in_acceptance = 0
            }
            next
          }
          
          # Detecta requisitos
          /^  - _Requisitos:/ {
            if (in_task == 1) {
              sub(/^  - _Requisitos: /, "", $0)
              sub(/_$/, "", $0)
              requirements = $0
              in_acceptance = 0
            }
            next
          }
          
          # Linha vazia ou nova seção encerra a tarefa atual
          /^$/ || /^##/ {
            if (in_task == 1 && task_num != "") {
              print task_num "|||" task_title "|||" description "|||" acceptance "|||" dependencies "|||" estimate "|||" requirements
              in_task = 0
              task_num = ""
              task_title = ""
              description = ""
              acceptance = ""
              dependencies = ""
              estimate = ""
              requirements = ""
              in_acceptance = 0
            }
          }
          
          END {
            # Imprime última tarefa se houver
            if (in_task == 1 && task_num != "") {
              print task_num "|||" task_title "|||" description "|||" acceptance "|||" dependencies "|||" estimate "|||" requirements
            }
          }
          ' "$TASKS_FILE" | while IFS='|||' read -r task_num task_title description acceptance dependencies estimate requirements; do
            
            # Verifica se issue já existe
            existing=$(gh issue list --repo ${{ github.repository }} --state all --search "[$task_num]" --json number --jq '.[0].number' 2>/dev/null || echo "")
            
            if [ -n "$existing" ]; then
              echo "Issue ja existe para tarefa $task_num"
            else
              create_issue "$task_num" "$task_title" "$description" "$acceptance" "$dependencies" "$estimate" "$requirements"
            fi
          done
          
          echo "Sincronizacao concluida!"
