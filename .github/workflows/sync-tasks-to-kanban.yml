name: Sync Tasks to Kanban

on:
  push:
    branches:
      - main
    paths:
      - '.kiro/specs/*/tasks.md'
  workflow_dispatch:

jobs:
  sync-tasks:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      
      - name: Create issues from tasks.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_URL: https://github.com/orgs/IA-para-DEVs-SCTEC-T2/projects/7
        run: |
          echo "Criando issues a partir do tasks.md..."
          
          TASKS_FILE=".kiro/specs/logpulse-ia/tasks.md"
          
          if [ ! -f "$TASKS_FILE" ]; then
            echo "Arquivo tasks.md nao encontrado"
            exit 1
          fi
          
          create_issue() {
            local task_num=$1
            local task_title=$2
            local is_opt=$3
            
            local title="[$task_num] $task_title"
            local body="Tarefa $task_num: $task_title - Spec: logpulse-ia - Veja tasks.md para detalhes"
            local labels="logpulse-ia,feature"
            
            if [ "$is_opt" = "true" ]; then
              labels="$labels,optional"
            fi
            
            echo "Criando issue: $title"
            
            gh issue create --title "$title" --body "$body" --label "$labels" --repo ${{ github.repository }} || echo "Erro ao criar issue"
            
            sleep 0.5
          }
          
          grep -E "^- \[ \](\*)? [0-9]+\. " "$TASKS_FILE" | while IFS= read -r line; do
            task_num=$(echo "$line" | sed -E 's/^- \[ \](\*)? ([0-9]+)\. .*/\2/')
            task_title=$(echo "$line" | sed -E 's/^- \[ \](\*)? [0-9]+\. (.*)/\2/')
            is_opt="false"
            
            if echo "$line" | grep -q '\*'; then
              is_opt="true"
            fi
            
            existing=$(gh issue list --repo ${{ github.repository }} --label "logpulse-ia" --state all --search "[$task_num]" --json number --jq '.[0].number' 2>/dev/null || echo "")
            
            if [ -n "$existing" ]; then
              echo "Issue ja existe para tarefa $task_num"
            else
              create_issue "$task_num" "$task_title" "$is_opt"
            fi
          done
          
          echo "Sincronizacao concluida!"
      
      - name: Add issues to project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/IA-para-DEVs-SCTEC-T2/projects/7
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labeled: logpulse-ia
          label-operator: OR
