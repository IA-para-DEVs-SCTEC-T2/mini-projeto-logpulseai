name: Create Issues from Tasks (Manual)

on:
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: read
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y
      
      - name: Create Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Criando issues..."
          
          # Tarefa 1
          gh issue create --title "[1] Configurar estrutura do projeto e dependências" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 1 ja existe"
          
          # Tarefa 2
          gh issue create --title "[2] Implementar modelos de dados com Pydantic" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 2 ja existe"
          
          # Tarefa 3
          gh issue create --title "[3] Implementar Parser de Logs com Drain3" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 3 ja existe"
          
          # Tarefa 4
          gh issue create --title "[4] Checkpoint - Validar Parser" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 4 ja existe"
          
          # Tarefa 5
          gh issue create --title "[5] Implementar Analyzer de Anomalias" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 5 ja existe"
          
          # Tarefa 6
          gh issue create --title "[6] Implementar AIEngine com Ollama" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 6 ja existe"
          
          # Tarefa 7
          gh issue create --title "[7] Checkpoint - Validar componentes core" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 7 ja existe"
          
          # Tarefa 8
          gh issue create --title "[8] Implementar camada de persistência (Repository)" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 8 ja existe"
          
          # Tarefa 9
          gh issue create --title "[9] Implementar camada de serviço (Services)" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 9 ja existe"
          
          # Tarefa 10
          gh issue create --title "[10] Implementar endpoints da API (Routers)" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 10 ja existe"
          
          # Tarefa 11
          gh issue create --title "[11] Implementar tratamento de erros e middleware" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 11 ja existe"
          
          # Tarefa 12
          gh issue create --title "[12] Implementar configuração e inicialização da aplicação" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 12 ja existe"
          
          # Tarefa 13
          gh issue create --title "[13] Checkpoint - Validar aplicação completa" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 13 ja existe"
          
          # Tarefa 14
          gh issue create --title "[14] Implementar validação de schemas Pydantic" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 14 ja existe"
          
          # Tarefa 15
          gh issue create --title "[15] Implementar logging estruturado" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 15 ja existe"
          
          # Tarefa 16
          gh issue create --title "[16] Criar documentação e exemplos" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 16 ja existe"
          
          # Tarefa 17
          gh issue create --title "[17] Configurar ferramentas de qualidade de código" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 17 ja existe"
          
          # Tarefa 18
          gh issue create --title "[18] Validar cobertura de testes" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 18 ja existe"
          
          # Tarefa 19
          gh issue create --title "[19] Checkpoint final - Validação completa do sistema" --body "Spec: logpulse-ia" --label "logpulse-ia,feature" || echo "Issue 19 ja existe"
          
          echo "Concluido!"
      
      - name: Add to Project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/orgs/IA-para-DEVs-SCTEC-T2/projects/7
          github-token: ${{ secrets.GITHUB_TOKEN }}
          labeled: logpulse-ia
          label-operator: OR
