[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpulse-ia"
version = "0.1.0"
description = "API REST para análise inteligente de logs com IA local (Ollama + LLaMA 3)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "LogPulse Team", email = "team@logpulse.local"}
]
keywords = ["logs", "ai", "analysis", "ollama", "llama3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "drain3>=0.9.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.7.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "ruff>=0.1.8",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.88.0",
]

[project.urls]
Homepage = "https://github.com/logpulse/logpulse-ia"
Documentation = "https://github.com/logpulse/logpulse-ia#readme"
Repository = "https://github.com/logpulse/logpulse-ia.git"
Issues = "https://github.com/logpulse/logpulse-ia/issues"

[tool.setuptools]
packages = ["src"]

# ============================================================================
# mypy — Tipagem Estática Rigorosa (strict mode)
# ============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    ".git",
]

# ============================================================================
# black — Formatação de Código
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # diretórios
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ============================================================================
# isort — Organização de Imports
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".venv", "venv", "build", "dist"]
known_first_party = ["src"]

# ============================================================================
# ruff — Linting Rápido
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long (black cuida disso)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ============================================================================
# pytest — Framework de Testes
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "unit: testes unitários",
    "integration: testes de integração",
    "slow: testes lentos",
    "property: testes de propriedade (hypothesis)",
]

# ============================================================================
# coverage — Cobertura de Testes
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# hypothesis — Property-Based Testing
# ============================================================================
[tool.hypothesis]
profile = "default"
max_examples = 100
