[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpulse-ia"
version = "0.1.0"
description = "Ferramenta CLI e API para análise inteligente de logs com suporte a IA"
requires-python = ">=3.11"
dependencies = [
    "typer~=0.12.0",
    "fastapi~=0.111.0",
    "uvicorn~=0.30.0",
    "pydantic~=2.7.0",
    "pydantic-settings~=2.0",
    "orjson~=3.10.0",
    "pyparsing~=3.1.0",
    "watchdog~=4.0.0",
    "httpx~=0.27.0",
    "tomli-w~=1.0.0",
    "structlog~=24.1.0",
    "aiosqlite~=0.20.0",
    "langchain>=0.2.0",
    "openai>=1.30.0",
    "drain3~=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "hypothesis==6.103.0",
    "mypy==1.10.0",
    "black==24.4.2",
    "isort==5.13.2",
    "ruff==0.4.7",
]

[project.scripts]
logpulse = "src.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
ignore = []

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=30"

[tool.coverage.run]
source = ["src"]
omit = ["src/cli/*"]

[tool.coverage.report]
show_missing = true
